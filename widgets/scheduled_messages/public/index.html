<html>
  <head>
    <meta charset="utf-8" />
    <style>
      #root {
        position: relative;
        overflow: hidden;
      }

      .list {
        display: flex;
        flex-direction: column;
        height: 100%;
      }

      .item {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        gap: var(--homey-su-3, 12px);
        height: 60px;
        box-sizing: border-box;
        border-bottom: 1px solid var(--homey-line-color-light, rgba(128, 128, 128, 0.2));
      }

      .item:last-child {
        border-bottom: none;
      }

      .when {
        flex: 0 0 auto;
        min-width: 64px;
        text-align: center;
      }

      .time {
        font-size: 18px;
        font-weight: 600;
        line-height: 22px;
      }

      .content {
        flex: 1 1 auto;
        min-width: 0;
      }

      .message,
      .meta {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .badge {
        display: inline-block;
        padding: 0 6px;
        margin-right: 4px;
        border-radius: 8px;
        font-size: 11px;
        line-height: 16px;
        color: #fff;
        background: #8569d8;
      }

      .empty {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
        text-align: center;
      }

      .item {
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }

      .item:active {
        opacity: 0.6;
      }

      .detail {
        display: none;
        height: 100%;
        box-sizing: border-box;
        overflow-y: auto;
        flex-direction: column;
        gap: var(--homey-su-2, 8px);
        animation: fade-in 0.15s ease-out;
      }

      body.show-detail .list {
        display: none;
      }

      body.show-detail .detail {
        display: flex;
      }

      @keyframes fade-in {
        from {
          opacity: 0;
          transform: translateY(4px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      .detail-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--homey-su-2, 8px);
      }

      .close {
        flex: 0 0 auto;
        width: 28px;
        height: 28px;
        border: none;
        border-radius: 50%;
        font-size: 16px;
        line-height: 28px;
        cursor: pointer;
        color: inherit;
        background: var(--homey-line-color-light, rgba(128, 128, 128, 0.2));
      }

      .detail-message {
        white-space: pre-wrap;
        word-break: break-word;
      }

      .field {
        display: flex;
        justify-content: space-between;
        gap: var(--homey-su-3, 12px);
        padding: 4px 0;
        border-top: 1px solid var(--homey-line-color-light, rgba(128, 128, 128, 0.2));
      }

      .field .value {
        text-align: right;
        word-break: break-word;
      }

      .actions {
        display: flex;
        gap: var(--homey-su-2, 8px);
        margin-top: var(--homey-su-1, 4px);
      }

      .actions button {
        flex: 1 1 0;
      }

      .skip {
        padding: 10px;
        border: none;
        border-radius: 10px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        color: inherit;
        background: var(--homey-line-color-light, rgba(128, 128, 128, 0.2));
        transition: background 0.15s, color 0.15s;
      }

      .skip.confirm {
        color: #fff;
        background: #8569d8;
      }

      .skip:disabled {
        opacity: 0.5;
      }

      .delete {
        padding: 10px;
        border: none;
        border-radius: 10px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        color: #e5484d;
        background: rgba(229, 72, 77, 0.12);
        transition: background 0.15s, color 0.15s;
      }

      .delete.confirm {
        color: #fff;
        background: #e5484d;
      }

      .delete:disabled {
        opacity: 0.5;
      }
    </style>
  </head>

  <body class="homey-widget">
    <div id="root">
      <div id="list" class="list"></div>
      <div id="detail" class="detail"></div>
    </div>

    <script type="text/javascript">
      function escapeHtml(value) {
        const div = document.createElement('div');
        div.textContent = value == null ? '' : String(value);
        return div.innerHTML;
      }

      function onHomeyReady(Homey) {
        const settings = Homey.getSettings();
        const ROW_HEIGHT = 60;
        const maxItems = Math.max(1, Number(settings.maxItems) || 5);
        const listElement = document.getElementById('list');
        const detailElement = document.getElementById('detail');
        let ready = false;
        let result = null;
        let openKey = null;

        function updateHeight() {
          // Measure the content instead of the body, the body is always at least as high as the widget
          const bottom = document.getElementById('root').getBoundingClientRect().bottom;
          const height = Math.max(Math.ceil(bottom + parseFloat(getComputedStyle(document.body).paddingBottom || 0)), 80);
          if (!ready) {
            Homey.ready({ height });
            ready = true;
          } else {
            Homey.setHeight(height);
          }
        }

        function renderList() {
          if (!result.items.length) {
            listElement.innerHTML = `<div class="empty homey-text-small-light">${escapeHtml(result.emptyText)}</div>`;
            return;
          }

          listElement.innerHTML = result.items
            .map((item) => {
              const meta = [item.recipient, item.category].filter(Boolean).map(escapeHtml).join(' · ');
              const badge = item.repeat ? `<span class="badge">↻ ${escapeHtml(item.repeat)}</span>` : '';

              return `
                <div class="item" data-key="${escapeHtml(item.key)}">
                  <div class="when">
                    <div class="time">${escapeHtml(item.time)}</div>
                    <div class="homey-text-small-light">${escapeHtml(item.day)}</div>
                  </div>
                  <div class="content">
                    <div class="message homey-text-regular">${escapeHtml(item.message)}</div>
                    <div class="meta homey-text-small-light">${badge}${meta}</div>
                  </div>
                </div>`;
            })
            .join('');
        }

        function renderDetail() {
          const item = result && result.items.find((listItem) => listItem.key === openKey);

          // The message was sent or removed in the meantime
          if (!item) {
            closeDetail();
            return;
          }

          const labels = result.labels;
          const repeat = item.repeat ? `${item.repeat}${item.repeatDays ? ` (${item.repeatDays})` : ''}` : '';
          const fields = [
            [labels.scheduled, item.date],
            [labels.repeat, repeat],
            [labels.recipient, item.recipient],
            [labels.category, item.category]
          ]
            .filter(([, value]) => value)
            .map(([label, value]) => `
              <div class="field homey-text-small">
                <span class="homey-text-small-light">${escapeHtml(label)}</span>
                <span class="value">${escapeHtml(value)}</span>
              </div>`)
            .join('');

          detailElement.innerHTML = `
            <div class="detail-header">
              <div class="time">${escapeHtml(item.time)} <span class="homey-text-small-light">${escapeHtml(item.day)}</span></div>
              <button class="close" id="close" aria-label="${escapeHtml(labels.close)}">✕</button>
            </div>
            <div class="detail-message homey-text-regular">${escapeHtml(item.message)}</div>
            <div>${fields}</div>
            <div class="actions">
              ${item.repeat ? `<button class="skip" id="skip">${escapeHtml(labels.skip)}</button>` : ''}
              <button class="delete" id="delete">${escapeHtml(item.repeat ? labels.deleteRecurring : labels.delete)}</button>
            </div>`;

          document.getElementById('close').addEventListener('click', closeDetail);

          document.getElementById('delete').addEventListener('click', (event) =>
            confirmAction(event.currentTarget, labels.confirmDelete, () => Homey.api('DELETE', `/${encodeURIComponent(item.id)}`, {}))
          );

          if (item.repeat) {
            document.getElementById('skip').addEventListener('click', (event) =>
              confirmAction(event.currentTarget, labels.confirmSkip, () =>
                Homey.api('POST', `/${encodeURIComponent(item.id)}/skip`, { timestamp: item.timestamp })
              )
            );
          }
        }

        function openDetail(key) {
          openKey = key;
          document.body.classList.add('show-detail');
          renderDetail();
          updateHeight();
        }

        function closeDetail() {
          openKey = null;
          document.body.classList.remove('show-detail');
          detailElement.innerHTML = '';
          updateHeight();
        }

        function confirmAction(button, confirmLabel, action) {
          const label = button.dataset.label || button.textContent;
          button.dataset.label = label;

          // First tap asks for confirmation, second tap runs the action
          if (!button.classList.contains('confirm')) {
            button.classList.add('confirm');
            button.textContent = confirmLabel;
            clearTimeout(button.confirmTimeout);
            button.confirmTimeout = setTimeout(() => {
              button.classList.remove('confirm');
              button.textContent = label;
            }, 3000);
            return;
          }

          clearTimeout(button.confirmTimeout);
          detailElement.querySelectorAll('.actions button').forEach((actionButton) => (actionButton.disabled = true));

          action()
            .then(() => {
              closeDetail();
              load();
            })
            .catch((error) => {
              console.error(error);
              detailElement.querySelectorAll('.actions button').forEach((actionButton) => (actionButton.disabled = false));
              button.classList.remove('confirm');
              button.textContent = label;
            });
        }

        function render(data) {
          result = data;
          renderList();
          if (openKey) renderDetail();
          updateHeight();
        }

        function load() {
          const query = new URLSearchParams({
            maxItems,
            category: settings.category || '',
            expandRecurring: settings.expandRecurring !== false
          });

          Homey.api('GET', `/?${query.toString()}`, {})
            .then(render)
            .catch((error) => {
              console.error(error);
              if (!ready) {
                Homey.ready();
                ready = true;
              }
            });
        }

        // The widget is always as high as the configured number of messages, the detail view scrolls within it
        document.getElementById('root').style.height = `${maxItems * ROW_HEIGHT}px`;

        listElement.addEventListener('click', (event) => {
          const itemElement = event.target.closest('.item');
          if (itemElement) openDetail(itemElement.dataset.key);
        });

        // Refresh when a message is added, sent or removed, and periodically to keep "Today" / "Tomorrow" up to date
        Homey.on('queue-updated', load);
        setInterval(load, 60 * 1000);

        load();
      }
    </script>
  </body>
</html>
